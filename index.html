<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ฐานข้อมูลพรรณไม้ในพื้นที่ปกปัก — เขตตำบลบ้านเดื่อและตำบลหนองข่า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf6f8;
      --surface: #ffffff;
      --pink-card: #fce4f1;
      --pink-card-soft: #fdf0f7;
      --pink-border: #eabdd5;
      --pink-bullet: #df699b;
      --border: #e6dce2;
      --ink: #22181e;
      --muted: #6e5a65;
      --brand: #b8336a;
      --brand-hover: #992656;
      --brand-ink: #ffffff;
      --accent-soft: #f7dce9;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 2px 8px rgba(45, 18, 33, 0.06), 0 1px 2px rgba(45, 18, 33, 0.04);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --font: "Sarabun", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.65;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header Shell */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1160px;
      margin: 0 auto;
      padding: var(--space-4) var(--space-6);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      font: inherit;
      color: inherit;
    }

    .brand-group:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 4px;
      border-radius: var(--radius-sm);
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid var(--pink-border);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .site-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--ink);
    }

    .site-subtitle {
      margin: 0;
      font-size: 0.875rem;
      color: var(--muted);
    }

    /* Main Container */
    .container {
      max-width: 1160px;
      margin: 0 auto;
      padding: var(--space-6);
    }

    /* Buttons & Inputs */
    .btn {
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    .btn:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .btn-primary {
      background: var(--brand);
      color: var(--brand-ink);
    }

    .btn-primary:hover {
      background: var(--brand-hover);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--pink-card-soft);
      border-color: var(--pink-border);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.85rem;
    }

    .btn-danger {
      background: var(--surface);
      color: #b42318;
      border-color: #fecdca;
    }

    .btn-danger:hover {
      background: #fef3f2;
      border-color: #fda29b;
    }

    .input,
    .select,
    .textarea {
      font: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      width: 100%;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(184, 51, 106, 0.14);
    }

    .textarea {
      min-height: 76px;
      resize: vertical;
      line-height: 1.55;
    }

    /* Toolbar & Base URL Config */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .base-url-bar {
      padding: var(--space-4) var(--space-5);
      margin-bottom: var(--space-4);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-3);
      background: var(--pink-card-soft);
      border-color: var(--pink-border);
    }

    .base-url-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
      flex-shrink: 0;
    }

    .base-url-input-wrap {
      flex: 1 1 280px;
      display: flex;
      gap: var(--space-2);
    }

    .base-url-hint {
      width: 100%;
      margin: 0;
      font-size: 0.825rem;
      color: var(--muted);
    }

    .toolbar {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-3);
    }

    .search-wrap {
      flex: 1 1 260px;
      position: relative;
    }

    .filter-wrap {
      flex: 0 1 240px;
      min-width: 190px;
    }

    /* Data Table */
    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead th {
      background: #faf4f7;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.875rem;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      user-select: none;
    }

    thead th.sortable {
      cursor: pointer;
    }

    thead th.sortable:hover {
      color: var(--brand);
    }

    tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 0.95rem;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr.plant-row {
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    tbody tr.plant-row:hover {
      background: var(--pink-card-soft);
    }

    .col-num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      width: 68px;
      color: var(--muted);
      font-weight: 600;
    }

    .sci-text {
      font-style: italic;
      color: var(--ink);
    }

    .row-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-2);
    }

    .empty-state {
      padding: var(--space-8) var(--space-6);
      text-align: center;
      color: var(--muted);
    }

    /* Detail View (Matches Pink Reference Layout IMG_2850.png) */
    .detail-wrapper {
      max-width: 780px;
      margin: 0 auto;
    }

    .detail-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .nav-prev-next {
      display: flex;
      gap: var(--space-2);
    }

    /* Dedicated Plant URL Bar */
    .plant-link-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-4);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-3);
      box-shadow: var(--shadow);
    }

    .plant-link-label {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--brand);
      flex-shrink: 0;
    }

    .plant-link-code {
      flex: 1 1 220px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      background: #f8f4f6;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--ink);
      overflow-x: auto;
      white-space: nowrap;
    }

    /* Pink Botanical Sheet (Reference: IMG_2850.png) */
    .pink-sheet {
      background: var(--pink-card);
      border: 1px solid var(--pink-border);
      border-radius: 18px;
      padding: var(--space-6);
      box-shadow: var(--shadow);
      color: var(--ink);
    }

    .sheet-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .sheet-title {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--ink);
    }

    .sheet-meta {
      padding: var(--space-2) 0 var(--space-3);
      margin-bottom: var(--space-4);
      border-top: 1px solid rgba(145, 85, 115, 0.2);
      border-bottom: 1px solid rgba(145, 85, 115, 0.2);
      font-size: 0.9rem;
      color: #6b4e5d;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-3);
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Photo Section inside Plant Page */
    .photo-section {
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid var(--pink-border);
      border-radius: 12px;
      padding: var(--space-4);
      margin-bottom: var(--space-5);
    }

    .photo-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }

    .photo-heading {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .photo-empty {
      border: 1.5px dashed var(--pink-border);
      border-radius: 10px;
      padding: var(--space-6) var(--space-4);
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.5);
      font-size: 0.925rem;
    }

    .photo-stage {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid var(--pink-border);
      max-height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-stage img {
      display: block;
      max-width: 100%;
      max-height: 438px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .photo-stage-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
    }

    .photo-thumbs {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }

    .thumb-btn {
      width: 68px;
      height: 68px;
      padding: 0;
      border-radius: 8px;
      border: 2px solid transparent;
      overflow: hidden;
      cursor: pointer;
      background: #fff;
    }

    .thumb-btn.active {
      border-color: var(--brand);
    }

    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hidden-file-input {
      display: none;
    }

    /* Pink Reference Fields Layout */
    .kv-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: var(--space-4);
    }

    .kv-line {
      font-size: 1.0625rem;
      line-height: 1.6;
    }

    .kv-label {
      font-weight: 700;
      margin-right: 10px;
      color: var(--ink);
    }

    .kv-val-upper {
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .section-block {
      margin-top: var(--space-4);
    }

    .section-heading {
      margin: 0 0 8px;
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--ink);
    }

    .pink-bullets {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pink-bullets li {
      position: relative;
      padding-left: 24px;
      font-size: 1.04rem;
      line-height: 1.65;
    }

    .pink-bullets li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 10px;
      width: 11px;
      height: 7px;
      background: var(--pink-bullet);
      border-radius: 1px;
    }

    .inline-section-line {
      margin-top: var(--space-4);
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .unfilled-text {
      color: #7c5c6c;
      font-style: italic;
      font-size: 0.95rem;
    }

    /* Inline Edit Form */
    .edit-form {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--pink-border);
      border-radius: 12px;
      padding: var(--space-5);
      margin-top: var(--space-3);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-4);
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: var(--space-3);
    }

    .form-field label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ink);
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: var(--space-2);
      margin-top: var(--space-4);
      padding-top: var(--space-3);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .container {
        padding: var(--space-4);
      }
      .header-inner {
        padding: var(--space-3) var(--space-4);
      }
      .pink-sheet {
        padding: var(--space-4);
      }
      .sheet-title {
        font-size: 1.45rem;
      }
      thead th,
      tbody td {
        padding: 10px 12px;
      }
    }
  </style>

<body>
  <header class="site-header">
    <div class="header-inner">
      <button type="button" class="brand-group" id="homeBrandBtn" aria-label="กลับหน้าหลักฐานข้อมูลพรรณไม้">
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
          </svg>
        </span>
        <div>
          <h1 class="site-title">ฐานข้อมูลพรรณไม้ในพื้นที่ปกปัก</h1>
          <p class="site-subtitle">เขตตำบลบ้านเดื่อและตำบลหนองข่า</p>
        </div>
      </button>
      <div id="headerRightSlot"></div>
    </div>
  </header>

  <main class="container" id="appRoot"></main>

  <script>
    // ข้อมูลพรรณไม้ทั้ง 71 ชนิดจากตารางสำรวจ (IMG_2846 - IMG_2849)
    // ข้อมูลลักษณะทางพฤกษศาสตร์ ถิ่นกำเนิด การกระจายพันธุ์ การขยายพันธุ์ และการใช้ประโยชน์
    // บรรจุเฉพาะข้อมูลจริงที่สืบค้นได้จากฐานข้อมูลพฤกษศาสตร์ไทย ส่วนที่ยังไม่มีข้อมูลเว้นว่างเพื่อให้ผู้ใช้แก้ไขเพิ่มเติมได้
    const INITIAL_PLANTS = [
      {
        id: 1,
        commonName: "ไผ่โจด",
        localName: "โจด",
        scientificName: "Vietnamosasa ciliata A. Camus",
        family: "Poaceae",
        stem: "ไม้ล้มลุกหลายปีพวกไผ่ ขึ้นเป็นกอแน่นสูง 1.5–5 เมตร ลำต้นรูปทรงกระบอกสีเขียวเทา เส้นผ่านศูนย์กลางประมาณ 7–10 มิลลิเมตร ปล้องยาว 7–10 เซนติเมตร ไม่มีหนาม แตกกิ่งตามข้อมาก",
        leaf: "ใบเดี่ยว เรียงสลับ รูปใบหอกหรือรูปใบหอกแกมรูปแถบ กว้าง 0.8–1 เซนติเมตร ยาว 8–15 เซนติเมตร ปลายใบเรียวแหลม โคนใบเกือบกลมหรือสอบแคบ ขอบใบคายและคม",
        flower: "ช่อดอกแบบช่อแยกแขนง ออกตามยอดของลำต้นที่ไม่มีใบซึ่งเจริญมาจากลำต้นใต้ดิน ช่อแขนงออกเป็นกระจุกตามข้อ ช่อดอกย่อยมี 6–9 ดอก",
        fruit: "ผลแบบผลแห้งเมล็ดติด มีขนาดเล็ก หน่อมีสีเทาแกมเหลืองอ่อนหรือเขียวอมม่วง ขนาดเล็กคล้ายหน่อไผ่รวก",
        origin: "",
        distribution: "ภาคตะวันออกเฉียงเหนือและภาคตะวันออกของประเทศไทย พบขึ้นตามป่าเต็งรังบนพื้นที่ราบสูงหินทราย",
        propagation: "",
        uses: "ลำต้นใช้ทำด้ามไม้กวาด ทำรั้ว และปลูกประดับตามบ้าน"
      },
      {
        id: 2,
        commonName: "ยอป่า",
        localName: "ยอป่า",
        scientificName: "Morinda coreia Buch.-Ham.",
        family: "Rubiaceae",
        stem: "ไม้ต้นขนาดเล็กถึงขนาดกลาง ผลัดใบ สูง 4–25 เมตร เรือนยอดเป็นพุ่มกลมรี ลำต้นมักคดงอ เปลือกนอกสีน้ำตาลปนเทา แตกเป็นสะเก็ด",
        leaf: "ใบเดี่ยว เรียงตรงข้ามสลับตั้งฉาก รูปไข่กลับ รูปไข่ หรือรูปรีแกมรูปขอบขนาน กว้าง 4–11 เซนติเมตร ยาว 8–23 เซนติเมตร ปลายใบแหลม โคนใบสอบเรียว มีหูใบอยู่ระหว่างก้านใบ",
        flower: "ดอกช่อกระจุกแน่นทรงกลม ออกที่ซอกใบหรือปลายกิ่ง ดอกย่อยสีขาว มีกลิ่นหอม กลีบดอกเชื่อมติดกันเป็นหลอด ปลายแยกเป็น 5–6 แฉก",

    const STORAGE_KEY_EDITS = "ban_duea_plants_edits_v1";
    const STORAGE_KEY_PHOTOS = "ban_duea_plants_photos_v1";
    const STORAGE_KEY_BASE_URL = "ban_duea_plants_baseurl_v1";

    // In-memory state (with best-effort localStorage sync)
    const state = {
      plants: INITIAL_PLANTS.map((p) => ({ ...p })),
      photosByPlant: {},
      baseUrl: "",
      searchQuery: "",
      familyFilter: "ALL",
      sortField: "id",
      sortDir: "asc",
      activePlantId: null,
      activePhotoIndex: 0,
      isEditing: false
    };

    function safeLoadStorage() {
      try {
        const savedBase = localStorage.getItem(STORAGE_KEY_BASE_URL);
        if (savedBase) {
          state.baseUrl = savedBase;
        }
        const savedEdits = localStorage.getItem(STORAGE_KEY_EDITS);
        if (savedEdits) {
          const parsedEdits = JSON.parse(savedEdits);
          if (parsedEdits && typeof parsedEdits === "object") {
            state.plants = state.plants.map((plant) => {
              const edit = parsedEdits[plant.id];
              return edit ? { ...plant, ...edit, id: plant.id } : plant;
            });
          }
        }
        const savedPhotos = localStorage.getItem(STORAGE_KEY_PHOTOS);
        if (savedPhotos) {
          const parsedPhotos = JSON.parse(savedPhotos);
          if (parsedPhotos && typeof parsedPhotos === "object") {
            state.photosByPlant = parsedPhotos;
          }
        }
      } catch (_) {
        // Sandbox or private browsing: keep in-memory state
      }
    }

    function safeSaveEdits() {
      try {
        const map = {};
        state.plants.forEach((p) => {
          map[p.id] = {
            commonName: p.commonName,
            localName: p.localName,
            scientificName: p.scientificName,
            family: p.family,
            stem: p.stem,
            leaf: p.leaf,
            flower: p.flower,
            fruit: p.fruit,
            origin: p.origin,
            distribution: p.distribution,
            propagation: p.propagation,
            uses: p.uses
          };
        });
        localStorage.setItem(STORAGE_KEY_EDITS, JSON.stringify(map));
      } catch (_) {}
    }

    function safeSavePhotos() {
      try {
        localStorage.setItem(STORAGE_KEY_PHOTOS, JSON.stringify(state.photosByPlant));
      } catch (_) {}
    }

    function safeSaveBaseUrl(val) {
      state.baseUrl = val.trim();
      try {
        localStorage.setItem(STORAGE_KEY_BASE_URL, state.baseUrl);
      } catch (_) {}
    }

    function padPlantId(id) {
      return String(id).padStart(2, "0");
    }

    function getEffectiveBaseUrl() {
      if (state.baseUrl) {
        return state.baseUrl.replace(/#.*$/, "");
      }
      const loc = window.location.href.split("#")[0];
      return loc;
    }

    function getPlantUrl(id) {
      return `${getEffectiveBaseUrl()}#plant-${padPlantId(id)}`;
    }

    function parsePlantIdFromLocation() {
      // Check hash first: #plant-01, #plant-1, #1
      const rawHash = (window.location.hash || "").replace(/^#\/?/, "").trim();
      if (rawHash) {
        const match = rawHash.match(/^(?:plant[-=/]?)?(\d{1,2})$/i);
        if (match) {
          const num = parseInt(match[1], 10);
          if (num >= 1 && num <= 71) return num;
        }
      }
      // Also support ?plant=1 query parameter
      try {
        const params = new URLSearchParams(window.location.search);
        const q = params.get("plant");
        if (q) {
          const num = parseInt(q, 10);
          if (num >= 1 && num <= 71) return num;
        }
      } catch (_) {}
      return null;
    }

    function navigateToPlant(id) {
      state.activePlantId = id;
      state.activePhotoIndex = 0;
      state.isEditing = false;
      const targetHash = `plant-${padPlantId(id)}`;
      if (window.location.hash !== `#${targetHash}`) {
        window.location.hash = targetHash;
      } else {
        renderApp();
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function navigateToDirectory() {
      state.activePlantId = null;
      state.isEditing = false;
      if (window.location.hash) {
        try {
          history.pushState("", document.title, window.location.pathname + window.location.search);
        } catch (_) {
          window.location.hash = "";
        }
      }
      renderApp();
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function copyTextWithButtonFeedback(text, btnEl, originalLabel) {
      let copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          copied = true;
        }
      } catch (_) {}

      if (!copied) {
        try {
          const temp = document.createElement("textarea");
          temp.value = text;
          temp.setAttribute("readonly", "");
          temp.style.position = "fixed";
          temp.style.opacity = "0";
          document.body.appendChild(temp);
          temp.select();
          copied = document.execCommand("copy");
          document.body.removeChild(temp);
        } catch (_) {}
      }

      if (btnEl) {
        btnEl.textContent = copied ? "คัดลอกลิงก์แล้ว ✓" : "คัดลอกแล้ว ✓";
        btnEl.disabled = true;
        setTimeout(() => {
          btnEl.textContent = originalLabel;
          btnEl.disabled = false;
        }, 1600);
      }
    }

    // Compress uploaded tree photo so multiple real photos store cleanly in browser
    function readAndCompressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("อ่านไฟล์รูปภาพไม่สำเร็จ"));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error("โหลดรูปภาพไม่สำเร็จ"));
          img.onload = () => {
            const maxDim = 1000;
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width >= height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
            resolve({
              dataUrl,
              name: file.name || "ภาพต้นไม้"
            });
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function getUniqueFamilies() {
      const set = new Set();
      state.plants.forEach((p) => {
        if (p.family) set.add(p.family.trim());
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b));
    }

    function getFilteredAndSortedPlants() {
      const q = state.searchQuery.trim().toLowerCase();
      const fam = state.familyFilter;

      const filtered = state.plants.filter((p) => {
        if (fam !== "ALL" && p.family !== fam) return false;
        if (!q) return true;
        const idStr = String(p.id);
        const padStr = padPlantId(p.id);
        return (
          idStr.includes(q) ||
          padStr.includes(q) ||
          p.commonName.toLowerCase().includes(q) ||
          p.localName.toLowerCase().includes(q) ||
          p.scientificName.toLowerCase().includes(q) ||
          p.family.toLowerCase().includes(q)
        );
      });

      filtered.sort((a, b) => {
        let cmp = 0;
        if (state.sortField === "id") {
          cmp = a.id - b.id;
        } else {
          cmp = String(a[state.sortField] || "").localeCompare(
            String(b[state.sortField] || ""),
            "th"
          );
        }
        return state.sortDir === "asc" ? cmp : -cmp;
      });

      return filtered;
    }

      state.activePlantId = parsedId;
      state.activePhotoIndex = 0;
      state.isEditing = false;
      renderApp();
    });

    safeLoadStorage();
    state.activePlantId = parsePlantIdFromLocation();
    renderApp();
  </script>
